<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>一个月 · Side A</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/scene4.css">
</head>
<body>
  <div id="app">
    <!-- three.js 画布。全局 saturation 滤镜作用在这一层 -->
    <div id="stage"></div>
    <!-- 跟随 3D 物体的 UI(气泡等) -->
    <div id="world-ui"></div>
    <!-- 不受饱和度影响的覆盖层(Prologue 的两点蓝、按钮等) -->
    <div id="overlay"></div>
    <!-- 白团子的对话框 -->
    <div id="dialog-layer">
      <div class="dialog">
        <div class="dialog-name"></div>
        <div class="dialog-text"></div>
        <div class="dialog-next">▼</div>
      </div>
    </div>
    <div id="fade"></div>
    <div id="debug"></div>
    <div id="boot-error" hidden>
      缺少 lib/three.min.js<br>
      请按 README 下载 three.js(r149)放进 lib 文件夹
    </div>
  </div>

  <script src="lib/three.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/core/util.js"></script>
  <script src="js/core/audio.js"></script>
  <script src="js/core/tilt.js"></script>
  <script src="js/core/glow.js"></script>
  <script src="js/core/sprites.js"></script>
  <script src="js/core/stage.js"></script>
  <script src="js/core/cat.js"></script>
  <script src="js/core/critter.js"></script>
  <script src="js/core/props.js"></script>
  <script src="js/core/dialog.js"></script>
  <script src="js/core/bubble.js"></script>
  <script src="js/core/director.js"></script>
  <script src="js/core/companion.js"></script>
  <script src="js/core/shards.js"></script>
  <script src="js/core/codesea.js"></script>
  <script src="js/scenes/prologue.js"></script>
  <script src="js/scenes/scene1.js"></script>
  <script src="js/scenes/scene2.js"></script>
  <script src="js/scenes/scene2_5.js"></script>
  <script src="js/scenes/scene3.js"></script>
  <script src="js/scenes/scene4.js"></script>
<script src="js/scenes/todo.js"></script>
  <script src="js/scenes/todo.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
